version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The project targets Spring Boot 3.x; a major upgrade is a deliberate decision, not a routine bump.
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node type definitions must match the Node version used in CI (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript major versions can change type-checking behaviour; upgrade deliberately.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # jsdom 30 removed an internal that Vitest 5.0's fetch compatibility layer relies on, which breaks
      # multipart uploads in tests. Stay on 29 until Vitest supports 30 (see docs/review-log.md, R-012).
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
