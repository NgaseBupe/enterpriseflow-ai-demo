spring:
  application:
    name: enterpriseflow-ai

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterpriseflow}
    username: ${DB_USERNAME:enterpriseflow}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      # Slightly above the application limit, so oversized files are rejected by the application
      # with a clear message; anything far larger is stopped here before being read into memory.
      max-file-size: 11MB
      max-request-size: 11MB

app:
  ai:
    # mock: built-in stand-in, no API key needed (default). A real provider is added in Sprint 5.
    provider: ${APP_AI_PROVIDER:mock}
  documents:
    storage-location: ${DOCUMENT_STORAGE_DIR:data/documents}
    max-file-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
