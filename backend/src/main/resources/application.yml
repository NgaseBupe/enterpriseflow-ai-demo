spring:
  application:
    name: enterpriseflow-ai

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/enterpriseflow}
    username: ${DB_USERNAME:enterpriseflow}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
